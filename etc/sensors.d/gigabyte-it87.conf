#   B840 EAGLE WIFI6E
#   B840 GAMING X WIFI6E
#   B840M AORUS ELITE WIFI6E
#   B850 AORUS ELITE WIFI7
#   B850 AORUS ELITE WIFI7 ICE
#   B850 EAGLE ICE
#   B850 EAGLE WIFI6E
#   B850 EAGLE WIFI7 ICE
#   B850 GAMING WIFI6
#   B850 GAMING X WIFI6E
#   B850M AORUS ELITE
#   B850M AORUS ELITE WIFI6E
#   B850M AORUS ELITE WIFI6E ICE
#   B850M AORUS ELITE WIFI7 ICE-P
#   B850M AORUS PRO WIFI7
#   X870 EAGLE WIFI7
#   X870 GAMING WIFI6
#   X870 GAMING X WIFI7
#   X870E AORUS ELITE WIFI7
#   X870E AORUS ELITE WIFI7 ICE
#   X870M AORUS ELITE WIFI7
#   X870M AORUS ELITE WIFI7 ICE
chip "it8696_a0060507-*"
    label in0     "CPU Vcore"
    label in1     "+3.3V"
    compute in1   @ * 1.649, @ / 1.649
    label in2     "+12V"
    compute in2   @ * 6, @ / 6
    label in3     "+5V"
    compute in3   @ * 2.5, @ / 2.5
    label in4     "CPU VCORE SOC"
    label in5     "CPU VCORE MISC"
    label in6     "CPU VDDIO MEM"
    label temp1   "System 1"
    label temp2   "PCH"
    label temp3   "CPU"
    label temp4   "PCIEX16"
    label temp5   "VRM MOS"
    label fan1    "CPU_FAN"
    label fan2    "SYS_FAN1"
    label fan3    "SYS_FAN2"
    label fan4    "SYS_FAN3"
    label fan5    "CPU_OPT"
    label fan6    "SYS_FAN4_PUMP"
    label pwm1    "CPU_FAN"
    label pwm2    "SYS_FAN1"
    label pwm3    "SYS_FAN2"
    label pwm4    "SYS_FAN3"
    label pwm5    "CPU_OPT"
    label pwm6    "SYS_FAN4_PUMP"
    # Hide only chip-supported channels not mapped by this SIV configuration.
    ignore temp6
